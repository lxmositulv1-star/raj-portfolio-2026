<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAJ MODS - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 480px; }
        .header-box { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        h2 { color: #fff; text-align: center; margin: 0; font-size: 24px; font-weight: 800; }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; margin-top: 20px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .nav-tabs button { margin-top: 0; padding: 8px; font-size: 12px; background: #e9ecef; color: #333; border-radius: 6px; }
        .nav-tabs button.active { background: #ff416c; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        #result { margin-top: 15px; padding: 12px; background: #f8f9fa; border-left: 4px solid #28a745; border-radius: 4px; font-size: 13px; display: none; word-break: break-all; }
        .key-list { margin-top: 15px; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 10px; background: #fafafa; }
        .key-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 12px; }
        .del-btn { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; width: auto; margin-top: 0; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-box">
        <h2>🔥 RAJ MODS 🔥</h2>
    </div>

    <div class="nav-tabs">
        <button id="tabKeyBtn" class="active" onclick="switchTab('keyGen')">Generate</button>
        <button id="tabListBtn" onclick="switchTab('keyList')">Key List & Delete</button>
        <button id="tabResellerBtn" onclick="switchTab('reseller')">Add Reseller</button>
    </div>

    <!-- Generate Key Section -->
    <div id="keyGenSection" class="section active">
        <label>KEY</label>
        <input type="text" id="keyInput" placeholder="KEY">

        <label>expiry date</label>
        <select id="hoursInput">
            <option value="24">24 Hours (1 Day)</option>
            <option value="168">168 Hours (7 Days)</option>
            <option value="720">720 Hours (30 Days)</option>
        </select>

        <label>Usage Limit (Devices)</label>
        <input type="number" id="limitInput" value="1" min="1">

        <button onclick="generateKey()">Create Key</button>
    </div>

    <!-- Key List & Delete Section -->
    <div id="keyListSection" class="section">
        <label>All Generated Keys (Click Delete to Remove)</label>
        <div class="key-list" id="keyListContainer">Loading...</div>
        <button onclick="loadKeys()" style="background:#17a2b8; margin-top:10px;">Refresh List</button>
    </div>

    <!-- Add Reseller Section -->
    <div id="resellerSection" class="section">
        <label>KEY</label>
        <input type="text" id="resellerName" placeholder="KEY">

        <label>Credit</label>
        <select id="resellerCredits">
            <option value="10">10 Credits</option>
            <option value="25">25 Credits</option>
            <option value="50">50 Credits</option>
            <option value="100">100 Credits</option>
            <option value="500">500 Credits</option>
        </select>

        <button onclick="addReseller()" style="background: #007bff;">Create / Add Credit</button>
    </div>

    <div id="result"></div>
</div>

<script>
function switchTab(tab) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));

    if(tab === 'keyGen') {
        document.getElementById('keyGenSection').classList.add('active');
        document.getElementById('tabKeyBtn').classList.add('active');
    } else if(tab === 'keyList') {
        document.getElementById('keyListSection').classList.add('active');
        document.getElementById('tabListBtn').classList.add('active');
        loadKeys();
    } else {
        document.getElementById('resellerSection').classList.add('active');
        document.getElementById('tabResellerBtn').classList.add('active');
    }
    document.getElementById('result').style.display = 'none';
}

async function generateKey() {
    const key = document.getElementById('keyInput').value;
    const hoursValid = document.getElementById('hoursInput').value;
    const maxDevices = document.getElementById('limitInput').value;
    const resultDiv = document.getElementById('result');

    if (!key) { alert('कृपया KEY भरें!'); return; }

    const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, hoursValid: Number(hoursValid), maxDevices: Number(maxDevices) })
    });
    const data = await response.json();
    resultDiv.style.display = 'block';
    if (data.success) {
        resultDiv.innerHTML = `<b style="color:green;">✔ Created!</b><br>KEY: ${data.data.key}`;
    } else {
        resultDiv.innerHTML = `<b style="color:red;">Error:</b> ${data.error}`;
    }
}

async function loadKeys() {
    const container = document.getElementById('keyListContainer');
    container.innerHTML = 'Loading...';
    const res = await fetch('/api/keys');
    const data = await res.json();
    if(data.success && data.data.length > 0) {
        container.innerHTML = '';
        data.data.forEach(k => {
            container.innerHTML += `<div class="key-item"><span><b>${k.key}</b> (${k.status})</span> <button class="del-btn" onclick="deleteKey('${k._id}')">Delete</button></div>`;
        });
    } else {
        container.innerHTML = 'No Keys Found!';
    }
}

async function deleteKey(id) {
    if(!confirm('Are you sure to delete this key?')) return;
    await fetch(`/api/key/${id}`, { method: 'DELETE' });
    loadKeys();
}

async function addReseller() {
    const username = document.getElementById('resellerName').value;
    const credits = document.getElementById('resellerCredits').value;
    const resultDiv = document.getElementById('result');

    if (!username) { alert('कृपया KEY भरें!'); return; }

    const response = await fetch('/api/add-reseller', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, credits: Number(credits) })
    });
    const data = await response.json();
    resultDiv.style.display = 'block';
    if (data.success) {
        resultDiv.innerHTML = `<b style="color:#007bff;">✔ Reseller Updated!</b><br>KEY: ${data.data.username}<br>Total Credits: <b>${data.data.credits}</b>`;
    } else {
        resultDiv.innerHTML = `<b style="color:red;">Error:</b> ${data.message}`;
    }
}
</script>

</body>
</html>
