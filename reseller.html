<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAJ MODS - Reseller Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 480px; }
        .header-box { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        h2 { color: #fff; text-align: center; margin: 0; font-size: 24px; font-weight: 800; }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
        button { background: #ff5722; color: white; border: none; padding: 12px; width: 100%; margin-top: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #e64a19; }
        #result { margin-top: 15px; padding: 12px; background: #f8f9fa; border-left: 4px solid #ff5722; border-radius: 4px; font-size: 13px; display: none; word-break: break-all; }
        .credit-box { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; text-align: center; font-size: 14px; display: none; }
        .btn-flex { display: flex; gap: 5px; margin-top: 5px; }
        .gen-btn { background: #17a2b8; font-size: 12px; padding: 8px; margin-top: 0; flex: 2; }
        .copy-btn { background: #6c757d; font-size: 12px; padding: 8px; margin-top: 0; flex: 1; }
        .copy-btn:hover { background: #5a6268; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-box">
        <h2>🔥 RAJ MODS 🔥</h2>
    </div>

    <!-- Reseller Login Section -->
    <div id="loginArea">
        <label>KEY</label>
        <input type="text" id="resellerUsername" placeholder="Enter Reseller Username">
        <button onclick="loginReseller()">Login</button>
        <p id="resellerLoginError" style="color:red; font-size:12px; text-align:center; margin-top:10px; display:none;">Access Denied: You are not an authorized Reseller!</p>
    </div>

    <!-- Reseller Dashboard -->
    <div id="dashboardArea" style="display:none;">
        <div id="creditDisplay" class="credit-box">Remaining Credits: 0</div>

        <label>KEY</label>
        <input type="text" id="keyInput" placeholder="KEY">
        <div class="btn-flex">
            <button type="button" class="gen-btn" onclick="generateRandomKey('keyInput')">⚡ Generate Random</button>
            <button type="button" class="copy-btn" onclick="copyToClipboard('keyInput')">📋 Copy</button>
        </div>

        <label>expiry date</label>
        <select id="hoursInput">
            <option value="24">24 Hours (1 Day)</option>
            <option value="168">168 Hours (7 Days)</option>
            <option value="720">720 Hours (30 Days)</option>
        </select>

        <label>Usage Limit (Devices)</label>
        <input type="number" id="limitInput" value="1" min="1">

        <button onclick="resellerGenerateKey()">Create Key (1 Credit)</button>
    </div>

    <div id="result"></div>
</div>

<script>
let currentReseller = '';

function generateRandomKey(elementId) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let randomStr = "RES";
    for (let i = 0; i < 8; i++) {
        randomStr += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById(elementId).value = randomStr;
}

function copyToClipboard(elementId) {
    const inputField = document.getElementById(elementId);
    if (!inputField.value) {
        alert('Nothing to copy!');
        return;
    }
    navigator.clipboard.writeText(inputField.value);
    alert('Copied to clipboard: ' + inputField.value);
}

async function loginReseller() {
    currentReseller = document.getElementById('resellerUsername').value.trim();
    if (!currentReseller) { alert('Please enter your Username!'); return; }

    const response = await fetch('/api/verify-reseller', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentReseller })
    });
    const data = await response.json();
    
    if(data.success) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('dashboardArea').style.display = 'block';
        document.getElementById('creditDisplay').style.display = 'block';
        document.getElementById('creditDisplay').innerText = `Remaining Credits: ${data.data.credits}`;
    } else {
        document.getElementById('resellerLoginError').style.display = 'block';
    }
}

async function resellerGenerateKey() {
    const key = document.getElementById('keyInput').value;
    const hoursValid = document.getElementById('hoursInput').value;
    const maxDevices = document.getElementById('limitInput').value;
    const resultDiv = document.getElementById('result');

    if (!key) { alert('Please enter a KEY!'); return; }

    const response = await fetch('/api/reseller-generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ resellerUsername: currentReseller, key, hoursValid: Number(hoursValid), maxDevices: Number(maxDevices) })
    });

    const data = await response.json();
    resultDiv.style.display = 'block';
    
    if (data.success) {
        resultDiv.style.borderLeftColor = '#28a745';
        resultDiv.innerHTML = `<b style="color:green;">✔ Key Generated!</b><br>KEY: ${data.data.key}<br><b>Remaining Credits: ${data.remainingCredits}</b>`;
        document.getElementById('creditDisplay').innerText = `Remaining Credits: ${data.remainingCredits}`;
        
        if(data.remainingCredits <= 0) {
            alert('Your credits are finished!');
            location.reload();
        }
    } else {
        resultDiv.style.borderLeftColor = '#dc3545';
        resultDiv.innerHTML = `<b style="color:red;">Error:</b> ${data.message || 'No Credits Left!'}`;
    }
}
</script>

</body>
</html>
